<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعود AI - مساعد المتجر الذكي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .chat-container { max-width: 400px; background: #fff; margin: auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 500px; }
        .chat-header { background: #007bff; color: #fff; padding: 15px; text-align: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .bot-message { background: #e9ecef; color: #333; align-self: flex-start; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .chat-footer { padding: 10px; background: #fff; border-top: 1px solid #ddd; display: flex; flex-direction: column; gap: 8px; }
        .checkout-buttons { display: flex; gap: 5px; }
        .btn-whatsapp { flex: 1; background: #25d366; color: #white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .btn-copy { flex: 1; background: #6c757d; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-whatsapp:hover { background: #20ba5a; }
        .btn-copy:hover { background: #5a6268; }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- هيدر البوت يظهر اسم المتجر -->
        <div class="chat-header" id="storeTitle">مساعد المتجر الذكي</div>
        
        <!-- رسائل الشات -->
        <div class="chat-messages" id="chatMessages">
            <!-- رسالة الترحيب بتنزل هنا تلقائياً -->
        </div>

        <!-- أزرار الطلب والنسخ -->
        <div class="chat-footer">
            <div class="checkout-buttons">
                <button onclick="sendWhatsAppOrder()" class="btn-whatsapp">إرسال للواتساب 🟢</button>
                <button onclick="copyOrderDetails()" class="btn-copy" id="copyBtn">نسخ الطلب 📋</button>
            </div>
        </div>
    </div>

    <script>
        // 1. محاكاة بيانات المتجر (كل تاجر وله بياناته الخاصة اللي تجيه عبر رابط الـ store)
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store') || 'default_store';

        // قاعدة بيانات تجريبية للمتاجر (مستقبلاً تقرأها من السيرفر)
        const storesDatabase = {
            "azzar-perfumes": {
                storeName: "متجر أزار للعطور 🌸",
                whatsappNumber: "966500000000",
                welcomeMessage: "يا هلا فيك بمتجر أزار للعطور! تبغى تشوف عروضنا الجديدة ولا تبحث عن عطر معين؟",
                sampleOrder: "مرحباً، أريد طلب:\n1x عطر أزار المركز\nالإجمالي: 150 ريال"
            },
            "clothes-store": {
                storeName: "متجر الأناقة للملابس 👔",
                whatsappNumber: "966511111111",
                welcomeMessage: "أهلاً بك في متجر الأناقة! نوفر لك أحدث صيحات الموضة. تفضل اعرض طلبك.",
                sampleOrder: "مرحباً، أريد طلب:\n1x ثوب رجالي مقاس 58\nالإجمالي: 220 ريال"
            },
            "default_store": {
                storeName: "متجر سعود AI التجريبي",
                whatsappNumber: "966500000000",
                welcomeMessage: "أهلاً بك! أنا مساعدك الذكي لتسهيل تسوقك.",
                sampleOrder: "مرحباً، أريد الاستفسار عن المنتجات المتاحة."
            }
        };

        // اختيار بيانات المتجر بناءً على الـ ID الموجود في الرابط (عزل البيانات)
        const currentStore = storesDatabase[storeId] || storesDatabase["default_store"];

        // 2. تحديث واجهة المتجر برمجياً
        document.getElementById("storeTitle").innerText = currentStore.storeName;

        // دالة إضافة رسالة للشات
        function appendMessage(text, senderClass) {
            const messagesContainer = document.getElementById("chatMessages");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${senderClass}`;
            messageDiv.innerText = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // تشغيل البوت برمجياً عند الفتح وعرض رسالة الترحيب الخاصة بالتاجر
        window.onload = function() {
            appendMessage(currentStore.welcomeMessage, 'bot-message');
        };

        // 3. دالة إرسال الطلب عبر الواتساب
        function sendWhatsAppOrder() {
            const text = encodeURIComponent(currentStore.sampleOrder);
            const url = `https://wa.me/${currentStore.whatsappNumber}?text=${text}`;
            window.open(url, '_blank');
        }

        // 4. دالة نسخ تفاصيل الطلب (المنقذ للعميل)
        function copyOrderDetails() {
            const textOrder = currentStore.sampleOrder;
            
            navigator.clipboard.writeText(textOrder).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerHTML = "تم النسخ بنجاح! ✅";
                btn.style.backgroundColor = "#28a745";
                
                setTimeout(() => {
                    btn.innerHTML = "نسخ الطلب 📋";
                    btn.style.backgroundColor = ""; 
                }, 3000);
            }).catch(err => {
                alert("تعذر النسخ، حاول مرة أخرى.");
            });
        }
    </script>
</body>
</html>
